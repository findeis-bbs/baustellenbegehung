<style>
html{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}

/* Layout: einspaltiges Tablet-Formular, Kopfband mit Logo, Prüfbereiche als Karten, Schnellwahl ja/nein */
:root{
  --bg:#f1f2f2; --surface:#ffffff; --ink:#2b3331; --muted:#6b7473; --line:#d6d9d9;
  --red:#ec1c24; --red-ink:#ffffff; --steel:#394240; --steel-ink:#ffffff;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --bad:#c4121a; --bad-bg:#fde8e9; --field:#f7f8f8;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',-apple-system,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161b1a; --surface:#222927; --ink:#eceeed; --muted:#9aa4a2; --line:#38413f;
  --red:#ff3b42; --steel:#0f1413; --ok:#5fd18d; --ok-bg:#16301f; --bad:#ff6b70; --bad-bg:#3a1a1c; --field:#1b2120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161b1a; --surface:#222927; --ink:#eceeed; --muted:#9aa4a2; --line:#38413f;
  --red:#ff3b42; --steel:#0f1413; --ok:#5fd18d; --ok-bg:#16301f; --bad:#ff6b70; --bad-bg:#3a1a1c; --field:#1b2120; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto}
header.top{background:var(--steel);color:var(--steel-ink);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:4px solid var(--red)}
header.top .in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:14px}
header.top img{width:64px;height:64px;background:#fff;border-radius:50%;padding:2px;flex:none}
header.top h1{font:700 28px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:0}
header.top small{display:block;font-size:13px;opacity:.75;margin-top:4px}
header.top .sp{flex:1}
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg label:focus-within{outline:3px solid var(--red);outline-offset:2px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--bad)}
h2{font:700 22px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.card>h2{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card>h2 .n{background:var(--red);color:#fff;min-width:34px;height:34px;padding:0 6px;border-radius:6px;display:inline-grid;place-items:center;font-size:20px}
.card>h2 .st{margin-left:auto;font:600 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.card>h2 .st.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f.wide{grid-column:1/-1}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--field);border-radius:8px;padding:10px 12px;font-size:16px;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.role{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.role:first-of-type{border-top:0}
.role b{font-weight:600}.role span{display:block;font-size:12px;color:var(--muted);font-weight:400}
@media(max-width:560px){.role{grid-template-columns:1fr}}
.item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .no{font:700 18px var(--f-display);color:var(--muted)}
.item .lb{min-width:0}.item .lb small{display:block;color:var(--muted);font-size:12px}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1.5px solid var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{min-width:56px;min-height:48px;display:grid;place-items:center;font-weight:700;cursor:pointer;padding:0 8px;background:var(--field);user-select:none}
.seg label+label{border-left:1.5px solid var(--line)}
.seg input:checked+label.y{background:var(--ok);color:#fff}
.seg input:checked+label.n{background:var(--bad);color:#fff}
.item .act{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}
.item.isbad{background:var(--bad-bg);margin:0 -16px;padding-inline:16px}
.item .sub{grid-column:2/-1}
@media(max-width:460px){.item{grid-template-columns:36px minmax(0,1fr)}.item .seg{grid-column:2}}
.cols{display:flex;gap:6px;justify-content:flex-end;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.m{border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;background:var(--field)}
.m .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}.m .hd b{font:700 18px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.m .hd .sp{flex:1}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.sig{border:1.5px dashed var(--muted);border-radius:10px;background:#fff;position:relative;touch-action:none}
.sig canvas{display:block;width:100%;height:180px;touch-action:none}
.sig .ph{position:absolute;inset:0;display:grid;place-items:center;color:#8a9290;pointer-events:none;font-size:15px}
.sig .ln{position:absolute;left:16px;right:16px;bottom:34px;border-bottom:1.5px solid #9aa4a2;pointer-events:none}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:500}
.chk input{width:26px;height:26px;accent-color:var(--red)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.bar .in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .info{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.list .row{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.list .row:first-child{border-top:0}
.list .row .t{flex:1;min-width:0}.list .row b{display:block}.list .row small{color:var(--muted)}
.pill{font:700 12px var(--f-body);padding:4px 10px;border-radius:99px;background:var(--field);border:1px solid var(--line);white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--steel);color:#fff;padding:12px 18px;border-radius:10px;z-index:30;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.meta{color:var(--muted);font-size:13px;margin-top:16px;text-align:center}
</style>
</head>

<div class="wrap" id="app"></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script>
const LOGO=document.getElementById('logo').src;
const AREAS=[
 {n:1,t:'Arbeitsschutzdokumente stehen in digitaler Form zur Verfügung',mode:'avail',items:[
  ['1.1','Arbeitsmedizinische Vorsorge','In Form von MA/Vorsorge Matrix'],
  ['1.2','Betriebsanweisungen','Persönlicher Teamszugang'],
  ['1.3','Baustellenordner','Persönlicher Teamszugang'],
  ['1.4','Arbeitserlaubnisscheine/Arbeitsanweisung','Persönlicher Teamszugang']]},
 {n:2,t:'Gefahrstoffe',items:[['2.1','Aufbewahrung'],['2.2','Verpackung'],['2.3','Kennzeichnung'],['2.4','Gefahrstoffkataster'],['2.5','Mineralischer Staub'],['2.6','Zementschlamm']]},
 {n:3,t:'Persönliche Schutzausrüstung',items:[['3.1','Aufbewahrung / Zustand allgemein'],['3.2','Verwendung / Tragedisziplin'],['3.3','Schutzhelm'],['3.4','Schutzbrille'],['3.5','Gesichtsschutz'],['3.6','Gehörschutz'],['3.7','Sicherheitsschuhe'],['3.8','Schutzhandschuhe'],['3.9','Schutzkleidung'],['3.10','Atemschutz'],['3.11','PSAgA']]},
 {n:4,t:'Verkehrswege',items:[['4.1','Absperrungen'],['4.2','Bauzaun'],['4.3','Treppen']]},
 {n:5,t:'Verkehrssicherung',items:[['5.1','Arbeitsstellen an Straßen'],['5.2','Verkehrszeichen / Markierung'],['5.3','Warnleuchten / Lichtzeichenanlage'],['5.4','Kraftfahrzeugbetrieb'],['5.5','Verkehrsbehördliche Genehmigung']]},
 {n:6,t:'Hochgelegene Arbeitsplätze',items:[['6.1','Seitenschutz'],['6.2','Absperrung'],['6.3','Fanggerüste'],['6.4','Arbeits- und Schutzgerüste'],['6.5','Auffangnetze'],['6.6','Sicherheitsgeschirre'],['6.7','Arbeitskörbe'],['6.8','Schutznetze'],['6.9','Schutzdächer']]},
 {n:7,t:'Baugruben und Gräben',items:[['7.1','Böschungswinkel 45° / 60° / 80°'],['7.2','Schutzstreifen 0,60 m'],['7.3','Verbau'],['7.4','Zugänge']]},
 {n:8,t:'Lastaufnahmeeinrichtungen',items:[['8.1','Tragmittel'],['8.2','Anschlagmittel'],['8.3','Lastaufnahmemittel'],['8.4','Prüffristen']]},
 {n:9,t:'Arbeitsmittel',items:[['9.1','Hubarbeitsbühnen'],['9.2','Flurförderzeuge'],['9.4','Kettensäge'],['9.5','Trennschleifer / Asphaltsäge'],['9.6','Werkzeug allgemein'],['9.7','Leitern'],['9.8','Prüffristen'],['9.9','Elektrische Anlagen und Betriebsmittel'],['9.10','Kompressoren / Aggregate'],['9.11','Minibagger'],['9.12','Teleskoplader']]},
 {n:10,t:'Maschinen / Großgeräte',items:[['10.1','Lader'],['10.2','Krane'],['10.3','Prüffristen'],['10.4','Betriebsanleitung'],['10.5','Betriebsanweisung']]},
 {n:11,t:'Sonstiges',free:true,items:[['11.1'],['11.2'],['11.3'],['11.4']]}
];
const ROLES=[
 ['Unternehmensleitung',''],['Verantwortliche Person',''],
 ['Fachkraft für Arbeitssicherheit','Betriebsärztin / Betriebsarzt'],['Koordinator nach BaustellV','SiGeKo'],
 ['Sicherheitsbeauftragte(r)',''],['Sonstige Personen','']];
const KEY='findeis-begehungen-v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>d?d.split('-').reverse().join('.'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

let store=[];try{store=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
let cur=null,view='list',saveT=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){toast('Speichern im Browser nicht möglich')}}
function newDoc(){const last=store.slice().sort((a,b)=>(b.datum||'').localeCompare(a.datum||''))[0];
 return{id:uid(),created:Date.now(),updated:Date.now(),bv:'',auftragsnr:'',ag:'',datum:today(),von:'',bis:'',letzte:last?last.datum:'',
  teil:ROLES.map(()=>''),ans:{},free:['','','',''],maengel:[],ersteller:'',sig:'',zk:{leitung:true,teiln:true},rueck:''}}
function touch(){cur.updated=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>{const i=store.findIndex(d=>d.id===cur.id);if(i<0)store.push(cur);else store[i]=cur;persist();const s=$('#saved');if(s)s.textContent='Gespeichert '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})},400)}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
const stats=d=>{let n=0,bad=0;for(const k in d.ans){n++;if(d.ans[k]==='nein')bad++}return{n,bad}};

function renderList(){
  view='list';$('#btnList').hidden=true;
  const docs=store.slice().sort((a,b)=>(b.datum||'').localeCompare(a.datum||'')||b.updated-a.updated);
  $('#app').innerHTML=`<div class="card"><h2>Begehungen</h2>
   <p class="hint" style="margin:0 0 12px">Auf diesem Gerät gespeichert. Tippen zum Öffnen.</p>
   <div class="list">${docs.length?docs.map(d=>{const s=stats(d);const open=d.maengel.filter(m=>!m.erledigt).length;return`<div class="row" data-id="${d.id}"><div class="t"><b>${esc(d.bv)||'Ohne Bauvorhaben'}</b><small>${fmtD(d.datum)}${d.auftragsnr?' · Auftrag '+esc(d.auftragsnr):''}${d.ersteller?' · '+esc(d.ersteller):''}</small></div>${d.sig?'<span class="pill ok">unterschrieben</span>':''}${open?`<span class="pill bad">${open} offen</span>`:''}</div>`}).join(''):'<p class="hint">Noch keine Begehung angelegt.</p>'}</div></div>
   <div class="bar"><div class="in"><div class="info">${docs.length} Begehung(en)</div><button class="btn primary" id="btnNew" type="button">Neue Begehung</button></div></div>`;
  $('#btnNew').onclick=()=>{cur=newDoc();renderForm()};
  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{cur=store.find(d=>d.id===r.dataset.id);renderForm()});
}

function renderForm(){
  view='form';$('#btnList').hidden=false;const d=cur;
  const maengelOpts=()=>{const o=['<option value="">allgemein</option>'];AREAS.forEach(a=>a.items.forEach(i=>o.push(`<option value="${i[0]}">zu ${i[0]} ${esc(i[1]||'Sonstiges')}</option>`)));return o.join('')};
  let h=`<div class="card"><h2>Baustelle</h2><div class="grid">
   <label class="f wide">Bauvorhaben<input type="text" data-k="bv" value="${esc(d.bv)}" autocomplete="off"></label>
   <label class="f">Auftragsnummer<input type="text" data-k="auftragsnr" value="${esc(d.auftragsnr)}" inputmode="numeric" autocomplete="off"></label>
   <label class="f">Auftraggeber<input type="text" data-k="ag" value="${esc(d.ag)}" autocomplete="off"></label>
   <label class="f">Datum der Begehung<input type="date" data-k="datum" value="${esc(d.datum)}"></label>
   <label class="f">Letzte Begehung am<input type="date" data-k="letzte" value="${esc(d.letzte)}"></label>
   <label class="f">von (Uhr)<input type="time" data-k="von" value="${esc(d.von)}"></label>
   <label class="f">bis (Uhr)<input type="time" data-k="bis" value="${esc(d.bis)}"></label></div></div>
  <div class="card"><h2>Teilnehmende</h2>${ROLES.map((r,i)=>`<div class="role"><b>${r[0]}${r[1]?`<span>${r[1]}</span>`:''}</b><input type="text" data-t="${i}" value="${esc(d.teil[i])}" placeholder="Name" autocomplete="off" aria-label="${r[0]}"></div>`).join('')}</div>`;
  AREAS.forEach(a=>{
    const bad=a.items.filter(i=>d.ans[i[0]]==='nein').length;
    h+=`<div class="card" data-area="${a.n}"><h2><span class="n">${a.n}</span>${a.t}<span class="st ${a.mode!=='avail'&&bad?'bad':''}" id="st${a.n}"></span></h2>
     <div class="cols"><span style="min-width:128px;text-align:center">${a.mode==='avail'?'vorhanden?':'In Ordnung?'}</span></div>`;
    a.items.forEach(i=>{const k=i[0],v=d.ans[k];
      h+=`<div class="item ${v==='nein'&&a.mode!=='avail'?'isbad':''}" data-k="${k}"><span class="no">${k}</span>
       <div class="lb">${a.free?`<input type="text" data-free="${k.split('.')[1]-1}" value="${esc(d.free[k.split('.')[1]-1])}" placeholder="Sonstiges…" aria-label="Punkt ${k}">`:`${esc(i[1])}${i[2]?`<small>${i[2]}</small>`:''}`}</div>
       <div class="seg" role="radiogroup" aria-label="${k}"><input type="radio" name="r${k}" id="y${k}" value="ja" ${v==='ja'?'checked':''}><label class="y" for="y${k}">ja</label><input type="radio" name="r${k}" id="n${k}" value="nein" ${v==='nein'?'checked':''}><label class="n" for="n${k}">nein</label></div>
       ${v==='nein'?`<div class="act"><button class="btn sm" type="button" data-addm="${k}">Mangel zu ${k} erfassen</button></div>`:''}</div>`});
    h+=`</div>`});
  h+=`<div class="card"><h2>Festgestellte Mängel und Maßnahmen</h2><div id="mlist"></div>
   <button class="btn" type="button" id="addM" style="margin-top:12px">Mangel hinzufügen</button>
   <p class="hint">Auch Mängel erfassen, die sofort abgestellt werden konnten.</p>
   <label class="f wide" style="margin-top:12px">Nach Beseitigung der festgestellten Mängel zurück an<input type="text" data-k="rueck" value="${esc(d.rueck)}"></label></div>
  <div class="card"><h2>Unterschrift</h2>
   <label class="f" style="margin-bottom:12px">Erstellerin / Ersteller<input type="text" data-k="ersteller" value="${esc(d.ersteller)}" autocomplete="name"></label>
   <div class="sig" id="sigBox"><canvas id="sig"></canvas><div class="ln"></div><div class="ph" id="sigPh">Hier mit Finger oder Stift unterschreiben</div></div>
   <div style="display:flex;gap:10px;margin-top:10px;align-items:center"><button class="btn sm" type="button" id="sigClear">Löschen</button><span class="hint" style="margin:0" id="sigDate"></span></div>
   <div style="margin-top:16px"><b>Zur Kenntnis an</b>
    <label class="chk"><input type="checkbox" data-zk="leitung" ${d.zk.leitung?'checked':''}>Unternehmensleitung</label>
    <label class="chk"><input type="checkbox" data-zk="teiln" ${d.zk.teiln?'checked':''}>Teilnehmende Person</label></div></div>
  <p class="meta">Dok.-Nr. 05.03 · Rev. 04_2024 · erstellt R. Kleinschmidt · geprüft K. Kneifel · freigegeben M. Findeis (12.04.2024)</p>
  <div style="display:flex;justify-content:center;margin-top:12px"><button class="btn danger sm" type="button" id="del">Begehung löschen</button></div>
  <div class="bar"><div class="in"><div class="info" id="saved">Wird automatisch gespeichert</div><button class="btn primary" type="button" id="pdf">PDF erstellen</button></div></div>`;
  $('#app').innerHTML=h;
  window.scrollTo(0,0);
  // bindings
  document.querySelectorAll('[data-k]:is(input)').forEach(e=>{if(e.closest('.item'))return;e.oninput=()=>{d[e.dataset.k]=e.value;touch()}});
  document.querySelectorAll('[data-t]').forEach(e=>e.oninput=()=>{d.teil[+e.dataset.t]=e.value;touch()});
  document.querySelectorAll('[data-free]').forEach(e=>e.oninput=()=>{d.free[+e.dataset.free]=e.value;touch()});
  document.querySelectorAll('[data-zk]').forEach(e=>e.onchange=()=>{d.zk[e.dataset.zk]=e.checked;touch()});
  document.querySelectorAll('.item input[type=radio]').forEach(e=>e.onclick=()=>{
    const k=e.name.slice(1);
    if(d.ans[k]===e.value){e.checked=false;delete d.ans[k]}else{d.ans[k]=e.value;
      if(e.value==='nein'&&!d.maengel.some(m=>m.punkt===k)){addM(k,true)}}
    touch();refreshItem(k)});
  document.querySelectorAll('[data-addm]').forEach(b=>b.onclick=()=>addM(b.dataset.addm));
  $('#addM').onclick=()=>addM('');
  $('#del').onclick=function(){if(this.dataset.s){store=store.filter(x=>x.id!==d.id);persist();renderList()}else{this.dataset.s=1;this.textContent='Wirklich löschen? Nochmal tippen';setTimeout(()=>{this.dataset.s='';this.textContent='Begehung löschen'},4000)}};
  $('#pdf').onclick=makePdf;
  AREAS.forEach(refreshArea);renderM();initSig();
  function addM(k,silent){d.maengel.push({id:uid(),punkt:k,text:'',wer:'',bis:'',erledigt:''});touch();renderM();
    if(!silent){const l=document.querySelectorAll('#mlist .m');const el=l[l.length-1];el.scrollIntoView({block:'center',behavior:'smooth'});el.querySelector('textarea').focus()}}
  function refreshItem(k){const it=document.querySelector(`.item[data-k="${k}"]`);const a=AREAS.find(a=>a.items.some(i=>i[0]===k));const v=d.ans[k];
    it.classList.toggle('isbad',v==='nein'&&a.mode!=='avail');let act=it.querySelector('.act');
    if(v==='nein'){if(!act){act=document.createElement('div');act.className='act';act.innerHTML=`<button class="btn sm" type="button" data-addm="${k}">Mangel zu ${k} erfassen</button>`;it.appendChild(act);act.firstChild.onclick=()=>addM(k)}}else if(act)act.remove();
    refreshArea(a)}
  function refreshArea(a){const el=$('#st'+a.n);const n=a.items.filter(i=>d.ans[i[0]]).length,bad=a.items.filter(i=>d.ans[i[0]]==='nein').length;
    el.textContent=a.mode==='avail'?`${n}/${a.items.length} geprüft`:(bad?`${bad} nicht in Ordnung`:`${n}/${a.items.length} geprüft`);el.classList.toggle('bad',a.mode!=='avail'&&bad>0)}
  function renderM(){const L=$('#mlist');if(!d.maengel.length){L.innerHTML='<p class="hint" style="margin:0">Keine Mängel erfasst.</p>';return}
    L.innerHTML=d.maengel.map((m,i)=>`<div class="m" data-m="${m.id}"><div class="hd"><b>Mangel ${i+1}</b><div class="sp"></div><button class="btn sm danger" type="button" data-rm="${m.id}">Entfernen</button></div>
     <div class="grid"><label class="f wide">Punkt<select data-mf="punkt">${maengelOpts().replace(`value="${m.punkt}"`,`value="${m.punkt}" selected`)}</select></label>
     <label class="f wide">Feststellung und Maßnahmen<textarea data-mf="text">${esc(m.text)}</textarea></label>
     <label class="f">Verantwortliche Person<input type="text" data-mf="wer" value="${esc(m.wer)}"></label>
     <label class="f">Bis wann<input type="date" data-mf="bis" value="${esc(m.bis)}"></label>
     <label class="f">Erledigt am<input type="date" data-mf="erledigt" value="${esc(m.erledigt)}"></label></div></div>`).join('');
    L.querySelectorAll('.m').forEach(box=>{const m=d.maengel.find(x=>x.id===box.dataset.m);
      box.querySelectorAll('[data-mf]').forEach(e=>{e.oninput=e.onchange=()=>{m[e.dataset.mf]=e.value;touch()}});
      box.querySelector('[data-rm]').onclick=()=>{d.maengel=d.maengel.filter(x=>x!==m);touch();renderM()}})}
  function initSig(){const c=$('#sig'),box=$('#sigBox'),ph=$('#sigPh');const ratio=Math.max(2,window.devicePixelRatio||1);
    const W=box.clientWidth,H=180;c.width=W*ratio;c.height=H*ratio;const x=c.getContext('2d');x.scale(ratio,ratio);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#14201d';
    const show=()=>{ph.hidden=!!d.sig;$('#sigDate').textContent=d.sig?'Unterschrieben am '+fmtD(d.sigDate||d.datum):''};
    if(d.sig){const im=new Image();im.onload=()=>x.drawImage(im,0,0,W,H);im.src=d.sig}
    show();let down=false,lx=0,ly=0,ink=false;
    const pt=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);[lx,ly]=pt(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.1,ly+.1);x.stroke();ph.hidden=true;e.preventDefault()};
    c.onpointermove=e=>{if(!down)return;const[px,py]=pt(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py;ink=true;e.preventDefault()};
    const end=()=>{if(!down)return;down=false;d.sig=c.toDataURL('image/png');d.sigDate=today();touch();show()};
    c.onpointerup=c.onpointercancel=end;
    $('#sigClear').onclick=()=>{x.clearRect(0,0,W,H);d.sig='';d.sigDate='';touch();show()}}
}

/* ---------- PDF (A4 hoch, Layout nach Word-Vorlage) ---------- */
async function logoPng(){return LOGO}
function makePdf(){
  const d=cur;const {jsPDF}=window.jspdf||{};if(!jsPDF){toast('PDF-Bibliothek nicht geladen');return}
  const P=new jsPDF({unit:'mm',format:'a4'});const W=210,L=12,R=198,CW=R-L;
  const RED=[236,28,36],ST=[57,66,64],LN=[160,166,165],FILL=[251,212,180];
  let page=1,y=0;const total=2;
  const txt=(s,x,yy,o={})=>{P.setFont('helvetica',o.b?'bold':'normal');P.setFontSize(o.s||9);P.setTextColor(...(o.c||[20,28,26]));P.text(String(s??''),x,yy,{align:o.a||'left',maxWidth:o.w})};
  const box=(x,yy,w,h,f)=>{P.setDrawColor(...LN);P.setLineWidth(.25);if(f){P.setFillColor(...f);P.rect(x,yy,w,h,'FD')}else P.rect(x,yy,w,h)};
  const header=()=>{box(L,10,CW,22);P.addImage(LOGO,'PNG',L+2,11,20,20);
    txt('Baustellenbegehung',L+28,19,{b:1,s:16});txt('Betonbohrservice GmbH',L+28,26,{s:9,c:[90,98,96]});
    box(R-62,10,62,22);txt('Dok.-Nr.: 05.03',R-60,17);txt('Rev.-Nr.: 04_2024',R-60,23);txt('Seite '+page+' von '+total,R-60,29);y=36};
  const footer=()=>{box(L,282,CW/3,10);box(L+CW/3,282,CW/3,10);box(L+2*CW/3,282,CW/3,10);
    [['erstellt','R. Kleinschmidt'],['geprüft','K. Kneifel'],['freigegeben','M. Findeis']].forEach((f,i)=>{const x=L+i*CW/3+2;txt(f[0],x,285.5,{s:7,c:[90,98,96]});txt('Datum: 12.04.2024   Name: '+f[1],x,289.5,{s:7})})};
  header();
  // Kopfdaten
  const row=(lab,val,x,yy,w,h=7)=>{box(x,yy,w,h);txt(lab,x+1.5,yy+4.6,{s:7.5,c:[90,98,96]});const lw=P.getTextWidth(lab);txt(val,x+1.5+lw+2.5,yy+4.8,{s:9.5,w:w-lw-6})};
  row('Bauvorhaben:',d.bv,L,y,CW*.62);row('Auftragsnummer:',d.auftragsnr,L+CW*.62,y,CW*.38);y+=7;
  row('Auftraggeber:',d.ag,L,y,CW);y+=7;
  row('Datum der Begehung:',fmtD(d.datum),L,y,CW*.5);row('Letzte Begehung am:',fmtD(d.letzte),L+CW*.5,y,CW*.5);y+=7;
  row('von:',(d.von?d.von+' Uhr':''),L,y,CW*.5);row('bis:',(d.bis?d.bis+' Uhr':''),L+CW*.5,y,CW*.5);y+=13;
  txt('Teilnehmende',L,y,{b:1,s:10});y+=2.5;
  ROLES.forEach((r,i)=>{const h=r[1]?10:7;box(L,y,CW*.45,h);box(L+CW*.45,y,CW*.55,h);
    txt(r[0].replace('Verantwortliche Person','Verantwortliche Person').replace('Sicherheitsbeauftragte(r)','Sicherheitsbeauftragte(r)'),L+1.5,y+4.5,{s:8.5});if(r[1])txt('('+r[1]+')',L+1.5,y+8,{s:7,c:[90,98,96]});
    txt(d.teil[i],L+CW*.45+1.5,y+4.8,{s:9.5,w:CW*.55-3});y+=h});
  y+=6;
  // Mängel
  txt('Festgestellte Mängel und Maßnahmen',L,y,{b:1,s:10});y+=2;
  const cw=[16,80,38,26,26];const cx=[L];cw.forEach((w,i)=>cx.push(cx[i]+w));
  const mhead=()=>{['Punkt','Feststellung und Maßnahmen','Verantwortliche Person','Bis wann','Erledigt am'].forEach((t,i)=>{box(cx[i],y,cw[i],7,FILL);txt(t,cx[i]+1.5,y+4.6,{b:1,s:8,w:cw[i]-3})});y+=7};
  mhead();
  const ms=d.maengel.length?d.maengel:[null,null,null];
  ms.forEach(m=>{const lines=m?P.setFontSize(9)&&P.splitTextToSize(m.text||'',cw[1]-3):[];const h=Math.max(9,lines.length*4+3);
    if(y+h>232){P.addPage();page++;header();mhead()}
    cw.forEach((w,i)=>box(cx[i],y,w,h));
    if(m){txt(m.punkt?'zu '+m.punkt:'allg.',cx[0]+1.5,y+5,{s:8.5});P.setFont('helvetica','normal');P.setFontSize(9);P.setTextColor(20,28,26);P.text(lines,cx[1]+1.5,y+5);
      txt(m.wer,cx[2]+1.5,y+5,{s:8.5,w:cw[2]-3});txt(fmtD(m.bis),cx[3]+1.5,y+5);txt(fmtD(m.erledigt),cx[4]+1.5,y+5)}
    y+=h});
  txt('Auch Mängel erfassen, die sofort abgestellt werden konnten.',L,y+5,{s:8,c:[90,98,96]});y+=10;
  txt('Nach Beseitigung der festgestellten Mängel zurück an:  '+(d.rueck||''),L,y,{s:9});y+=8;
  // Unterschrift
  if(y>238){P.addPage();page++;header()}
  const sy=Math.max(y,236);box(L,sy,CW*.3,22);box(L+CW*.3,sy,CW*.7,22);
  txt('Datum',L+1.5,sy+4,{s:7.5,c:[90,98,96]});txt(fmtD(d.sigDate||d.datum),L+1.5,sy+12,{s:10});
  txt('Unterschrift Erstellerin/Ersteller',L+CW*.3+1.5,sy+4,{s:7.5,c:[90,98,96]});
  if(d.sig)P.addImage(d.sig,'PNG',L+CW*.3+4,sy+5,56,15);
  if(d.ersteller)txt(d.ersteller,R-2,sy+19,{a:'right',s:8.5});
  const zk=[d.zk.leitung&&'Unternehmensleitung',d.zk.teiln&&'Teilnehmende Person'].filter(Boolean);
  txt('Zur Kenntnis an: '+(zk.join(', ')||'–'),L,sy+27,{s:8.5});
  footer();
  // Seite Checkliste
  P.addPage();page++;header();
  const colW=(CW-4)/2;let cy=[y,y],col=0;const LIM=277,RH=5,FS=7.5;
  const tick=(x,yy,on,bad)=>{P.setDrawColor(...LN);P.setLineWidth(.3);P.rect(x,yy,3.2,3.2);if(on){P.setDrawColor(...(bad?RED:[31,138,76]));P.setLineWidth(.7);if(bad){P.line(x+.5,yy+.5,x+2.7,yy+2.7);P.line(x+2.7,yy+.5,x+.5,yy+2.7)}else{P.line(x+.6,yy+1.7,x+1.4,yy+2.7);P.line(x+1.4,yy+2.7,x+2.6,yy+.6)}}};
  const rowsOf=a=>a.items.map(i=>{const label=a.free?(d.free[+i[0].split('.')[1]-1]||''):i[1];P.setFontSize(FS);P.setFont('helvetica','normal');const ls=P.splitTextToSize(label,colW-36);return{i,label,ls,h:Math.max(RH,ls.length*3.3+1.8+(i[2]?2.8:0))}});
  const headH=a=>a.t.length>34?9:6;
  const areaH=(a,rs)=>headH(a)+rs.reduce((t,r)=>t+r.h,0)+3;
  const place=(a,c)=>{const rs=rowsOf(a);let x=L+c*(colW+4),yy=cy[c];const th=headH(a);
    box(x,yy,colW-22,th,FILL);box(x+colW-22,yy,11,th,FILL);box(x+colW-11,yy,11,th,FILL);
    txt(a.n+'.',x+1.5,yy+4,{b:1,s:8});txt(a.t,x+8,yy+4,{b:1,s:7.5,w:colW-32});txt('ja',x+colW-16.5,yy+4,{b:1,s:7.5,a:'center'});txt('nein',x+colW-5.5,yy+4,{b:1,s:7.5,a:'center'});yy+=th;
    rs.forEach(({i,ls,h})=>{const k=i[0],v=d.ans[k];
      box(x,yy,colW-22,h);box(x+colW-22,yy,11,h);box(x+colW-11,yy,11,h);
      txt(k,x+1.5,yy+3.6,{s:7,c:[90,98,96]});P.setFont('helvetica','normal');P.setFontSize(FS);P.setTextColor(20,28,26);P.text(ls,x+10,yy+3.6);if(i[2])txt(i[2],x+10,yy+3.6+ls.length*3.3,{s:6,c:[90,98,96]});
      const my=yy+h/2-1.6;tick(x+colW-16.5-1.6,my,v==='ja',false);tick(x+colW-5.5-1.6,my,v==='nein',true);yy+=h});
    cy[c]=yy+3};
  AREAS.forEach(a=>{const h=areaH(a,rowsOf(a));if(col===0&&cy[0]+h>LIM)col=1;place(a,col)});
  const mx=Math.max(...cy);if(mx>LIM+3)toast('Hinweis: Seite 2 sehr voll, bitte PDF prüfen');
  txt('Abschnitt 1: ja = vorhanden. Abschnitte 2 bis 11: ja = in Ordnung, nein = Mangel (siehe Mängelliste). Nicht relevante Punkte bleiben leer.',L,279.5,{s:6.5,c:[90,98,96]});
  footer();
  const name=`Baustellenbegehung_${(d.bv||'ohne-BV').replace(/[^\wäöüÄÖÜß-]+/g,'_').slice(0,40)}_${d.datum}.pdf`;
  saveFile(name,P.output('blob'));
}
async function saveFile(name,blob){
  const file=new File([blob],name,{type:'application/pdf'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});toast('PDF bereitgestellt');return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('PDF erstellt');
}
$('#btnList').onclick=renderList;
renderList();
